What is Method Overriding?

Method overriding means:

A child class provides its own implementation of a method that already exists in the parent class.

Conditions:

Must use class inheritance (extends)

Same method name

Same parameters

Real Project-Level Scenario in Playwright

Imagine you have:

BasePage.ts
LoginPage.ts
SalesforceLoginPage.ts

You want common functionality in BasePage, but allow specific pages to customize behavior.

Example 1 — BasePage (Parent Class)

BasePage.ts

export class BasePage {
    async navigate(url: string) {
        console.log("Navigating to:", url);
    }

    async verifyPageTitle(title: string) {
        console.log("Verifying title:", title);
    }
}


Example 2 — LoginPage (Child Class)

import { BasePage } from "./BasePage";

export class LoginPage extends BasePage {

    async navigate(url: string) {
        console.log("Custom Login Navigation to:", url);
    }
}


Here:

navigate() method exists in BasePage
LoginPage overrides it.

What Happens?

If you do:

const login = new LoginPage();
login.navigate("https://example.com
");

Output:
Custom Login Navigation to: https://example.com

Child method overrides parent method.