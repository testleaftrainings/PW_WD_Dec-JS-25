Script used to set global variable:
-----------------------------------

In generate token :-
------------------

let tokenresponse = pm.response.json();
console.log(tokenresponse)

let resToken = tokenresponse.access_token
console.log(resToken)

pm.globals.set("ResourceTk",resToken)

let url = tokenresponse.instance_url
console.log(url)

pm.collectionVariables.set("InstanceUrl",url)


    pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
    });
--------------------------

In Create_Lead :-



var leadresponse = pm.response.json();

var resID = leadresponse.id

console.log("Lead Id is"+ resID)

pm.environment.set("LeadId", resID)

pm.test("Status code is 201", function () {
    pm.response.to.have.status(201);
});


