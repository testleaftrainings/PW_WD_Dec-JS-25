## One-line Interview Answer

> **Custom fixture is used to centralize common setup and teardown logic so that tests remain clean, reusable, and maintainable.**



1. Interface :
-----------------

- Complete hiding of the implemented.
- 100% abstraction.
- Only unimplemented methods.

Summarize 

- class extends another class
- abstract extends another abstract class
- interface extends another interface
- class extends abstract class
- class implements interface
- class extends abstract class im plemnets interface

We cannot see implementation of your page fixture, context browser in playwright everytging is put in as interface

2. Abstraction
----------------- 

abstract class :

- 0 to 100% abstraction.
- Method signature --> unimplementedmethods
- Implemented methods --> logic 


-------------------------------------------------------------------------------------

lop : async ({ page }, use) => {
    const lop = new LoginPage(page)
    await use(lop)
},
This means:

“Before each test, create a LoginPage object and give it to the test as lop.”

Break it into 4 logical steps
1. lop :
You are defining a new fixture named lop.

So now in your test you can write:

test('create lead', async ({ lop }) => {
    await lop.enterUsername()
})
2. async ({ page }, use) =>
This is the fixture function.

It receives:

{ page } → built-in Playwright page

use → a special callback that hands the object to the test

Think of it as:

setup -> run test -> teardown
3. const lop = new LoginPage(page)
This is pure POM (Page Object Model).

You are saying:

“Wrap Playwright’s raw page inside my own LoginPage class.”

So instead of:

await page.fill('#username', 'demo')
You now do:

await lop.enterUsername('demo')
Cleaner, reusable, readable.

4. await use(lop)
This is the most important line.

It means:

“Give this lop object to the test and pause here until the test finishes.”

Visually:

Before hook:
  const lop = new LoginPage(page)

Test runs:
  test({ lop }) { ... }

After hook:
  (anything after use runs here)
Mental Model (best way to teach)
This fixture is equivalent to:

beforeEach(() => {
   create LoginPage
})

test(() => {
   use LoginPage
})

afterEach(() => {
   cleanup
})
But all in one line.

Why this is extremely powerful
Without fixture:

test('lead', async ({ page }) => {
   const lop = new LoginPage(page)
   const hp = new HomePage(page)
   const lp = new LeadPage(page)
})
With fixture:

test('lead', async ({ lop, hp, lp }) => {
   // already created
})
No object creation in tests.
No boilerplate.
No repetition.

Real meaning in one sentence
This line:

lop : async({page},use)=>{ ... }
Means:

“Create this object once per test, inject it automatically, and manage its lifecycle.”

Why use() exists at all
Because Playwright supports teardown:

lop : async({page},use)=>{
    const lop = new LoginPage(page)

    await use(lop)   // test runs here

    console.log("After test finished")
}
Anything after use() runs after the test.

Exactly like:

beforeEach

afterEach

in one function.
