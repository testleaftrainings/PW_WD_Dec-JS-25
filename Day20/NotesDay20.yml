Frequently Asked Questions :
----------------------------

### What response.json() really does

When you call an API (like ServiceNow’s), it sends back data in JSON text format, for example:

✅ response.json() → JSON string ➜ object


------------------------------------------------------------------------------------

## 1️⃣ What is `response` actually?

When you call an API in Playwright / fetch / Axios:

```ts
const response = await request.get(url);
```

`response` is **NOT the JSON data**.

It is a **Response Object** — a wrapper created by the HTTP client that contains:

| Inside `response`                        |
| ---------------------------------------- |
| Status code (200, 404…)                  |
| Headers                                  |
| Cookies                                  |
| Response time                            |
| Body (raw text from server)              |
| Helper methods like `.json()`, `.text()` |

So `response` is called an **object** because it has:

```ts
response.status()
response.headers()
response.ok()
response.json()
response.text()
```

That is **behavior + data** → that’s an object.

---

## 2️⃣ What does the server actually send?

ServiceNow sends this over the network:

```json
{
  "result": {
    "sys_id": "123",
    "short_description": "Login issue"
  }
}
```

This travels as **plain text**:

```
"{ "result": { "sys_id": "123", "short_description": "Login issue" } }"
```

The browser / Playwright receives **text**, not an object.

---

## 3️⃣ What does `response.json()` do?

`response.json()` means:

> “Hey Response object, take your body text and convert it into a JavaScript object for me.”

Internally it does:

```js
JSON.parse(responseBodyText)
```

So:

| Step              | What it is            |
| ----------------- | --------------------- |
| Server sends      | JSON **string**       |
| `response.body()` | JSON **string**       |
| `response.json()` | JavaScript **object** |

---

## 4️⃣ Why do we say **response is an object**?

Because `response` is like this:

```js
response = {
  status: 200,
  headers: {...},
  body: "{ 'name':'Ravi' }",
  json: function() { ... },
  text: function() { ... }
}
```

This is a **JavaScript object with properties and methods**.

That’s why we say:

> **`response` is an object, but `response.json()` returns another object (the API data).**

---

## 5️⃣ Real-world analogy 🚚

Think of ordering on Swiggy:

| Thing                | API meaning       |
| -------------------- | ----------------- |
| Delivery box         | `response` object |
| Bill, items, receipt | Inside the box    |
| Opening the box      | `response.json()` |
| Food you eat         | Actual data       |

You don’t eat the box — you open it first 😄

---

## 6️⃣ In Playwright (ServiceNow example)

```ts
const response = await request.get(url);   // 📦 response object
const data = await response.json();        // 📄 actual API data

console.log(data.result.sys_id);
```

`response` = **API wrapper object**
`data` = **real JSON content**

