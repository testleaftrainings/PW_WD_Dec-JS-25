 What is External Test Data in Postman?

It means:

Test data is NOT written inside the request
It is stored in a separate file (CSV or JSON) and Postman reads it during execution.

Just like:

Excel / CSV in Selenium DataProvider

📄 Example – CSV file (leads.csv)
firstName,lastName,company
Ravi,Krishnan,OpenAI
Amit,Sharma,TCS
Neha,Verma,Infosys

🧩 In Postman Request Body

Instead of hardcoded values, you write:

{
  "FirstName": "{{firstName}}",
  "LastName": "{{lastName}}",
  "Company": "{{company}}"
}

▶ In Collection Runner (your screenshot)

You click Select File
Choose leads.csv
Set Iterations = 3

Postman will run:

Iteration	Data Used
1	Ravi, Krishnan, OpenAI
2	Amit, Sharma, TCS
3	Neha, Verma, Infosys

Each row = one API execution.

 Same thing in Playwright

Postman CSV == Playwright data-driven testing

const data = require('./leads.json');

for (const lead of data) {
   await request.post("/lead", { data: lead });
}