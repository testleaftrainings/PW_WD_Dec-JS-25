Constructor:

Definition
A constructor in TypeScript is a method named constructor() that runs once at the time of object creation and sets up the initial state of the object.
Or a Special method to initialize the object

*******************************************************************************************


class LoginPage{

//Properties:
------------

username = "democsr2"
password = "crmsfa"

//Method :

fill(){ // Method block--> block of code to perform an action
//Actionables
fill method
use the properties "username" and "password" to perform the action to fill the login form
}

click(){
//Actionables
click method
}
}


const lp = new LoginPage() // ✔️ Memory is allocated //syntax to create an object(reference/ instance/copy) for a class to call the methods(actionable blocks) inside the class 
lp.fill()
lp.click()

